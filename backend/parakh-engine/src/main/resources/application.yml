server:
  port: 8082
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

spring:
  application:
    name: parakh-engine
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/parakh}
    username: ${SPRING_DATASOURCE_USERNAME:parakh}
    password: ${SPRING_DATASOURCE_PASSWORD:parakh_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 35
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    consumer:
      group-id: parakh-engine-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Never let a Kafka outage stall the price poller or the setup monitor.
      properties:
        max.block.ms: 2000
        linger.ms: 5

jwt:
  secret: ${JWT_SECRET:parakh_secret}

parakh:
  market:
    poll-interval-ms: ${MARKET_POLL_INTERVAL_MS:5000}
  scanner:
    enabled: ${SCANNER_ENABLED:true}
    interval-ms: ${SCANNER_INTERVAL_MS:60000}
    initial-delay-ms: 20000

logging:
  level:
    root: INFO
    com.parakh: INFO
