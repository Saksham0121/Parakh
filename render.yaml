# Render Blueprint: deploy with "New → Blueprint" and point it at this repo.
# Everything here is on Render's free plans:
#   parakh-api   Docker web service: core + engine in one JVM (uses free instance hours)
#   parakh-web   Static site: React build served from Render's CDN (doesn't use instance hours)
#   Database     a free Neon Postgres (doesn't expire); you paste its URL as DATABASE_URL
#   parakh-cache Key Value (Redis-compatible) shared cache; optional, the API runs without it
#
# Free web services share 750 instance-hours per workspace per month and sleep after
# 15 minutes without traffic, so this API and another free backend can coexist.

services:
  - type: web
    name: parakh-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - Dockerfile
    envVars:
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      # Render asks for it on first deploy; change it later under parakh-api → Environment.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parakh-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Free instances have 0.1 CPU: scan and poll less often than the defaults.
      - key: SCANNER_INTERVAL_MS
        value: "180000"
      - key: MARKET_POLL_INTERVAL_MS
        value: "20000"

  - type: web
    name: parakh-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # No Socket.IO on a single-port host: the UI polls prices and alerts instead.
      - key: VITE_REALTIME
        value: "false"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Same-origin API calls: no CORS, and the JWT stays on one origin.
      # If Render gives the API a different hostname, update this destination.
      - type: rewrite
        source: /api/*
        destination: https://parakh-api-u0dl.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: parakh-cache
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
