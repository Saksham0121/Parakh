server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy is handled at the docker-compose nginx level in production,
    # but we can configure it here if the frontend Nginx serves directly.
    # For now, rely on the main infra Nginx.
}
