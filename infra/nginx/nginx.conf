worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─── Logging ────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── General ────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Use Docker's internal DNS resolver to handle scaled containers dynamically
    resolver 127.0.0.11 valid=10s;

    # ─── Upstreams ──────────────────────────────────

    # Parakh Core (Auth, Watchlist, Setups, Fundamentals, Alerts)
    upstream parakh_core {
        least_conn;
        server parakh-core:8080;
        keepalive 64;
    }

    # Parakh Engine (Market Data, Indicators, Backtesting Simulator)
    upstream parakh_engine {
        least_conn;
        server parakh-engine:8082;
        keepalive 64;
    }

    # WebSocket Gateway (netty-socketio running inside parakh-core)
    upstream ws_gateway {
        ip_hash;
        server parakh-core:3009;
    }

    # Frontend container
    upstream frontend {
        server frontend:80;
    }

    # ─── Server ─────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /nginx-health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Market data & quote endpoints -> parakh_engine
        location /api/market/ {
            proxy_pass http://parakh_engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Backtest simulator & leaderboard endpoints -> parakh_engine
        location /api/scanner/ {
            proxy_pass http://parakh_engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Scans of up to 200 symbols can take a while on a cold cache.
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /api/backtests/ {
            proxy_pass http://parakh_engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Indicator endpoints -> parakh_engine
        location /api/indicators/ {
            proxy_pass http://parakh_engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # All other API routes (Auth, Watchlist, Setups, Alerts, Fundamentals) -> parakh_core
        location /api/ {
            proxy_pass http://parakh_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket -> netty-socketio on parakh-core:3009 with upgrade support
        location /socket.io/ {
            proxy_pass http://ws_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # Frontend — served from the built Docker container
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Support SPA client-side routing
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
