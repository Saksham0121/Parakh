worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─── Logging ────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── General ────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ─── Upstreams ──────────────────────────────────

    # API Gateway — round-robin (add more instances for scaling)
    upstream api_gateway {
        least_conn;
        server host.docker.internal:3000;
        # server host.docker.internal:3000 weight=1;  # add more for scaling
    }

    # WebSocket Gateway — sticky sessions via IP hash
    upstream ws_gateway {
        ip_hash;
        server host.docker.internal:3009;
        # server host.docker.internal:3010;  # add more for scaling
    }

    # ─── Server ─────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /nginx-health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # API routes — proxy to api_gateway
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # WebSocket — proxy to ws_gateway with upgrade support
        location /socket.io/ {
            proxy_pass http://ws_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeouts (keep alive)
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # Frontend (when running behind nginx)
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Vite HMR WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
