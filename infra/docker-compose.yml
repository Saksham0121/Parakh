version: '3.8'

services:
  # ─── Databases ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parakh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parakh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parakh_secret}
      POSTGRES_DB: ${POSTGRES_DB:-parakh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parakh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: parakh-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-parakh}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-parakh_secret}
      POSTGRES_DB: ${TIMESCALE_DB:-parakh_timeseries}
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-parakh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: parakh-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Message Broker ──────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: parakh-kafka
    restart: unless-stopped
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cluster
      CLUSTER_ID: parakh-kafka-cluster-001
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: parakh-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: parakh
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"

  # ─── Connection Pooler ────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p2
    container_name: parakh-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_secret}@postgres:5432/${POSTGRES_DB:-parakh}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"

  # ─── Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: parakh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis

  # ─── Services ─────────────────────────────────────────
  api-gateway:
    build:
      context: ../api-gateway
    container_name: parakh-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-parakh_secret}
    depends_on:
      - redis
      - user-service

  user-service:
    build:
      context: ../user-service
    container_name: parakh-user-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_secret}@postgres:5432/${POSTGRES_DB:-parakh}
      - JWT_SECRET=${JWT_SECRET:-parakh_secret}
    depends_on:
      postgres:
        condition: service_healthy

  market-data-service:
    build:
      context: ../market-data-service
    container_name: parakh-market-data
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  indicator-service:
    build:
      context: ../indicator-service
    container_name: parakh-indicator
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  setup-service:
    build:
      context: ../setup-service
    container_name: parakh-setup-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_secret}@postgres:5432/${POSTGRES_DB:-parakh}
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  alert-service:
    build:
      context: ../alert-service
    container_name: parakh-alert-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_secret}@postgres:5432/${POSTGRES_DB:-parakh}
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  websocket-gateway:
    build:
      context: ../websocket-gateway
    container_name: parakh-ws-gateway
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-parakh_secret}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    container_name: parakh-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api-gateway

  fundamentals-service:
    build:
      context: ../fundamentals-service
    container_name: parakh-fundamentals-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_secret}@postgres:5432/${POSTGRES_DB:-parakh}
      - REDIS_HOST=redis
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backtest-service:
    build:
      context: ../backtest-service
    container_name: parakh-backtest-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_secret}@postgres:5432/${POSTGRES_DB:-parakh}
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  kafka_data:
